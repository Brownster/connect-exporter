# AWS Connect Exporter Configuration
# Production configuration template for AWS Connect monitoring

# Server configuration
listen_address: 127.0.0.1
listen_port: 9090
log_level: info

# AWS Configuration
aws:
  # AWS region where your Connect instance is located
  region: "us-east-1"
  # AWS Connect Instance ARN - REQUIRED
  # Format: arn:aws:connect:region:account-id:instance/instance-id
  instance_arn: "arn:aws:connect:us-east-1:123456789012:instance/your-instance-id"

# Collector Configuration
collectors:
  # Generic collectors replace legacy hard-coded collectors
  agent_realtime_status:
    enabled: true
    interval: 60

  generic_realtime:
    enabled: true
    interval: 30
    collectors:
      - name: "queue_realtime_metrics"
        metrics:
          - aws_name: "AGENTS_AVAILABLE"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "Available"
        groupings: ["QUEUE", "CHANNEL"]
        filters: []

  generic_historical:
    enabled: true
    interval: 300
    collectors:
      - name: "historical_queue"
        metrics:
          - aws_name: "CONTACTS_HANDLED"
            prometheus_name: "connect_historical_contacts_handled_total"
            labels: {}
        groupings: ["QUEUE", "CHANNEL"]
        filters: []

# Global settings
global:
  # Default timeout for all operations
  timeout: 30s
  
  # Default labels to add to all metrics
  labels:
    environment: "production"
    service: "aws-connect"
    
  # Retry configuration
  retry:
    max_attempts: 3
    backoff_duration: 1s
    max_backoff_duration: 5s

# Optional: Custom metric configurations
metrics:
  # Metric filtering (disable unwanted metrics)
  disabled_metrics: []
  
  # Custom metric labels (applied to all metrics)
  custom_labels:
    team: "contact-center"
    cost_center: "customer-service"

# AWS IAM Permissions Required:
# - connect:ListQueues
# - connect:GetCurrentMetricData
# - connect:GetMetricDataV2
# - connect:ListAgentStatuses
# - connect:GetCurrentUserData
#
# Example IAM Policy:
# {
#   "Version": "2012-10-17",
#   "Statement": [
#     {
#       "Effect": "Allow",
#       "Action": [
#         "connect:ListQueues",
#         "connect:GetCurrentMetricData",
#         "connect:GetMetricDataV2",
#         "connect:ListAgentStatuses",
#         "connect:GetCurrentUserData"
#       ],
#       "Resource": "arn:aws:connect:*:*:instance/your-instance-id"
#     }

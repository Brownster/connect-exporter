# AWS Connect Exporter - Development Configuration
# Uses mock AWS Connect API for local development

# Server configuration
web:
  listen_address: 127.0.0.1
  listen_port: 9090
log_level: debug

# AWS Configuration (for development with mock API)
aws:
  # Mock AWS region
  region: "eu-west-2"
  # Mock AWS Connect Instance ARN (matches mock API data)
  instance_arn: "arn:aws:connect:eu-west-2:123456789012:instance/f604177c-b2ab-4c76-9033-635d195b2772"

# Collector Configuration
collectors:
  # Realtime Queue Metrics Collector
  realtime_queue:
    enabled: false  # Replaced by generic_realtime collector
    interval: 30  # Faster collection for development (30 seconds)
    metrics_cache_ttl: 15s
    queue_cache_ttl: 5m
    queue_refresh_interval: 1m
    queues_include_regex: ""
    
  # Agent Status Collector  
  agent_status:
    enabled: false  # Replaced by generic_realtime collector
    interval: 60  # Faster collection for development (1 minute)

  # Agent Realtime Status Collector
  agent_realtime_status:
    enabled: true
    interval: 30  # Faster collection for development (30 seconds)

  # Historical Queue Metrics Collector
  historical_queue:
    enabled: false  # Replaced by generic_historical collector
    interval: 60  # Faster collection for development (1 minute)

  historical_calls:
    enabled: false
    interval: 60

  historical_aht:
    enabled: false  # Replaced by generic_historical collector
    interval: 60

  historical_acw:
    enabled: false  # Replaced by generic_historical collector
    interval: 60

  generic_realtime:
    enabled: true
    interval: 30
    collectors:
      # Replaces: realtime_queue_collector.go
      - name: "realtime_queue"
        metrics:
          - aws_name: "AGENTS_AVAILABLE"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "Available"
          - aws_name: "AGENTS_STAFFED"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "Staffed"
          - aws_name: "AGENTS_ON_CONTACT"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "OnContact"
          - aws_name: "AGENTS_AFTER_CONTACT_WORK"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "AfterContactWork"
          - aws_name: "AGENTS_NON_PRODUCTIVE"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "NonProductive"
          - aws_name: "AGENTS_ERROR"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "Error"
          - aws_name: "SLOTS_AVAILABLE"
            prometheus_name: "connect_queue_slots_available"
            labels: {}
          - aws_name: "SLOTS_ACTIVE"
            prometheus_name: "connect_queue_slots_active"
            labels: {}
          - aws_name: "CONTACTS_IN_QUEUE"
            prometheus_name: "connect_queue_contacts_in_queue"
            labels: {}
          - aws_name: "OLDEST_CONTACT_AGE"
            prometheus_name: "connect_queue_oldest_contact_age_seconds"
            labels: {}
          # - aws_name: "AGENTS_ONLINE"
          #   prometheus_name: "connect_queue_agents"
          #   labels:
          #     state: "Online"
          # - aws_name: "AGENTS_ON_CALL"
          #   prometheus_name: "connect_queue_agents"
          #   labels:
          #     state: "OnCall"
          # - aws_name: "CONTACTS_SCHEDULED"
          #   prometheus_name: "connect_queue_contacts_scheduled"
          #   labels: {}
        groupings:
          - "QUEUE"
          - "CHANNEL"
        filters: []
      # Replaces: agent_state_collector.go (queue-aggregated agent states)
      - name: "agent_state"
        metrics:
          - aws_name: "AGENTS_AVAILABLE"
            prometheus_name: "agents"
            labels:
              state: "Available"
          - aws_name: "AGENTS_STAFFED"
            prometheus_name: "agents"
            labels:
              state: "Staffed"
          - aws_name: "AGENTS_ON_CONTACT"
            prometheus_name: "agents"
            labels:
              state: "OnContact"
          - aws_name: "AGENTS_AFTER_CONTACT_WORK"
            prometheus_name: "agents"
            labels:
              state: "AfterContactWork"
          - aws_name: "AGENTS_NON_PRODUCTIVE"
            prometheus_name: "agents"
            labels:
              state: "NonProductive"
          - aws_name: "AGENTS_ERROR"
            prometheus_name: "agents"
            labels:
              state: "Error"
          # - aws_name: "AGENTS_ONLINE"
          #   prometheus_name: "agents"
          #   labels:
          #     state: "Online"
          # - aws_name: "AGENTS_ON_CALL"
          #   prometheus_name: "agents"
          #   labels:
          #     state: "OnCall"
        groupings:
          - "QUEUE"
        filters: []

  # Generic Historical Metrics Collector (config-driven)
  generic_historical:
    enabled: true
    interval: 300  # 5 minutes for historical data
    collectors:
      # Replaces: historical_queue_collector.go
      - name: "historical_queue"
        metrics:
          - aws_name: "CONTACTS_HANDLED"
            prometheus_name: "connect_historical_contacts_handled_total"
            labels: {}
          - aws_name: "CONTACTS_ABANDONED"
            prometheus_name: "connect_historical_contacts_abandoned_total"
            labels: {}
        groupings:
          - "QUEUE"
          - "CHANNEL"
        filters:
          - key: "CHANNEL"
            values: ["VOICE", "CHAT", "TASK"]
      # Replaces: historical_calls_collector.go (direction-specific)
      - name: "historical_calls_inbound"
        metrics:
          - aws_name: "CONTACTS_HANDLED"
            prometheus_name: "connect_historical_contacts_handled_total"
            labels:
              direction: "inbound"
            metric_filters:
              - key: "INITIATION_METHOD"
                values: ["INBOUND"]
          - aws_name: "CONTACTS_ABANDONED"
            prometheus_name: "connect_historical_contacts_abandoned_total"
            labels:
              direction: "inbound"
            metric_filters:
              - key: "INITIATION_METHOD"
                values: ["INBOUND"]
        groupings:
          - "QUEUE"
        filters: []
      - name: "historical_calls_outbound"
        metrics:
          - aws_name: "CONTACTS_HANDLED"
            prometheus_name: "connect_historical_contacts_handled_total"
            labels:
              direction: "outbound"
            metric_filters:
              - key: "INITIATION_METHOD"
                values: ["OUTBOUND", "CALLBACK", "API"]
          - aws_name: "CONTACTS_ABANDONED"
            prometheus_name: "connect_historical_contacts_abandoned_total"
            labels:
              direction: "outbound"
            metric_filters:
              - key: "INITIATION_METHOD"
                values: ["OUTBOUND", "CALLBACK", "API"]
        groupings:
          - "QUEUE"
        filters: []
      # Replaces: historical_avg_time_collector.go (AHT)
      - name: "historical_aht"
        metrics:
          - aws_name: "AVG_HANDLE_TIME"
            prometheus_name: "connect_historical_avg_handle_time_seconds"
            labels: {}
        groupings:
          - "QUEUE"
          - "CHANNEL"
        filters:
          - key: "CHANNEL"
            values: ["VOICE", "CHAT", "TASK"]
      # Replaces: historical_avg_time_collector.go (ACW)
      - name: "historical_acw"
        metrics:
          - aws_name: "AVG_AFTER_CONTACT_WORK_TIME"
            prometheus_name: "connect_historical_avg_after_contact_work_time_seconds"
            labels: {}
        groupings:
          - "QUEUE"
          - "CHANNEL"
        filters:
          - key: "CHANNEL"
            values: ["VOICE", "CHAT", "TASK"]

# Global settings
global:
  # Shorter timeout for development
  timeout: 10s
  
  # Development labels
  labels:
    environment: "development"
    service: "aws-connect"
    fqdn: "localhost"
    ip_address: "127.0.0.1"
    location: "test"
    country: "US"
    
  # Aggressive retry for testing
  retry:
    max_attempts: 3
    backoff_duration: 1s
    max_backoff_duration: 3s

# Development Environment Variables:
# ENV=development (enables mock API mode)
# AWS_CONNECT_MOCK_ENDPOINT=http://localhost:3000 (optional, defaults to localhost:3000)
#
# To use this configuration:
# 1. Start the mock API server: cd docs/tools/aws-mock-api-main && node server.js
# 2. Set environment: export ENV=development
# 3. Run exporter: ./aws-connect-exporter --config.file=config.development.yml
#
# Mock API provides:
# - 4 predefined queues (Sales, Support, Monitoring Voice/Chat)
# - Realistic metric simulation with configurable error rates
# - AWS-like pagination and error responses
# - Admin endpoint for error rate adjustment: curl -X POST http://localhost:3000/admin/errorRate -d '{"rate": 0.1}'

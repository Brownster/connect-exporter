        #   prometheus_name: "connect_historical_sum_retry_callback_attempts"
        #   labels: {}
        groupings:
          - "QUEUE"
          - "CHANNEL"
        filters:
          - key: "CHANNEL"
            values: ["VOICE", "CHAT", "TASK"]
      # Replaces: historical_calls_collector.go (direction-specific)
      - name: "historical_calls_inbound"
        metrics:
          - aws_name: "CONTACTS_HANDLED"
            prometheus_name: "connect_historical_contacts_handled_total"
            labels:
              direction: "inbound"
            metric_filters:
              - key: "INITIATION_METHOD"
                values: ["INBOUND"]
          - aws_name: "CONTACTS_ABANDONED"
            prometheus_name: "connect_historical_contacts_abandoned_total"
            labels:
              direction: "inbound"
            metric_filters:
              - key: "INITIATION_METHOD"
                values: ["INBOUND"]
        groupings:
          - "QUEUE"
        filters: []
      - name: "historical_calls_outbound"
        metrics:
          - aws_name: "CONTACTS_HANDLED"
            prometheus_name: "connect_historical_contacts_handled_total"
            labels:
              direction: "outbound"
            metric_filters:
              - key: "INITIATION_METHOD"
                values: ["OUTBOUND", "CALLBACK", "API"]
          - aws_name: "CONTACTS_ABANDONED"
            prometheus_name: "connect_historical_contacts_abandoned_total"
            labels:
              direction: "outbound"
            metric_filters:
              - key: "INITIATION_METHOD"
                values: ["OUTBOUND", "CALLBACK", "API"]
        groupings:
          - "QUEUE"
        filters: []
      # Replaces: historical_avg_time_collector.go (AHT)
      - name: "historical_aht"
        metrics:
          - aws_name: "AVG_HANDLE_TIME"
            prometheus_name: "connect_historical_avg_handle_time_seconds"
            labels: {}
        groupings:
          - "QUEUE"
          - "CHANNEL"
        filters:
          - key: "CHANNEL"
            values: ["VOICE", "CHAT", "TASK"]
      # Replaces: historical_avg_time_collector.go (ACW)
      - name: "historical_acw"
        metrics:
          - aws_name: "AVG_AFTER_CONTACT_WORK_TIME"
            prometheus_name: "connect_historical_avg_after_contact_work_time_seconds"
            labels: {}
        groupings:
          - "QUEUE"
          - "CHANNEL"
        filters:
          - key: "CHANNEL"
            values: ["VOICE", "CHAT", "TASK"]

# Global settings
global:
  # Default timeout for all operations
  timeout: 30s
  
  # Default labels to add to all metrics
  labels:
    environment: "test"
    service: "aws-connect"
    
  # Retry configuration
  retry:
    max_attempts: 3
    backoff_duration: 1s
    max_backoff_duration: 5s


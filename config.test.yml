listen_address: 127.0.0.1
listen_port: 9091
log_level: info

aws:
  region: "eu-west-2"
  instance_arn: "arn:aws:connect:eu-west-2:123456789012:instance/f604177c-b2ab-4c76-9033-635d195b2772"
  endpoint: "http://localhost:3000"  # Point to mock API

# Collector Configuration - Testing all metrics
collectors:
  # Individual agent status tracking for comprehensive testing
  agent_realtime_status:
    enabled: true
    interval: 60

  generic_realtime:
    enabled: true
    interval: 30
    collectors:
      # Replaces: realtime_queue_collector.go
      - name: "realtime_queue"
        metrics:
          # Core real-time metrics for testing
          - aws_name: "AGENTS_AVAILABLE"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "Available"
          - aws_name: "AGENTS_STAFFED"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "Staffed"
          - aws_name: "AGENTS_ON_CONTACT"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "OnContact"
          - aws_name: "AGENTS_AFTER_CONTACT_WORK"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "AfterContactWork"
          - aws_name: "AGENTS_NON_PRODUCTIVE"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "NonProductive"
          - aws_name: "AGENTS_ERROR"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "Error"
          - aws_name: "SLOTS_AVAILABLE"
            prometheus_name: "connect_queue_slots_available"
            labels: {}
          - aws_name: "SLOTS_ACTIVE"
            prometheus_name: "connect_queue_slots_active"
            labels: {}
          - aws_name: "CONTACTS_IN_QUEUE"
            prometheus_name: "connect_queue_contacts_in_queue"
            labels: {}
          - aws_name: "OLDEST_CONTACT_AGE"
            prometheus_name: "connect_queue_oldest_contact_age_seconds"
            labels: {}
        groupings:
          - "QUEUE"
          - "CHANNEL"
        filters: []
      # Aggregated agent state metrics for testing
      - name: "agent_state"
        metrics:
          - aws_name: "AGENTS_AVAILABLE"
            prometheus_name: "agents"
            labels:
              state: "Available"
          - aws_name: "AGENTS_STAFFED"
            prometheus_name: "agents"
            labels:
              state: "Staffed"
          - aws_name: "AGENTS_ON_CONTACT"
            prometheus_name: "agents"
            labels:
              state: "OnContact"
          - aws_name: "AGENTS_AFTER_CONTACT_WORK"
            prometheus_name: "agents"
            labels:
              state: "AfterContactWork"
          - aws_name: "AGENTS_NON_PRODUCTIVE"
            prometheus_name: "agents"
            labels:
              state: "NonProductive"
          - aws_name: "AGENTS_ERROR"
            prometheus_name: "agents"
            labels:
              state: "Error"
        groupings: ["QUEUE"]
        filters: []

  # Generic Historical Metrics Collector (config-driven)
  generic_historical:
    enabled: true
    interval: 300  # 5 minutes for historical data
    collectors:
      # Replaces: historical_queue_collector.go
      - name: "historical_queue"
        metrics:
          - aws_name: "CONTACTS_HANDLED"
            prometheus_name: "connect_historical_contacts_handled_total"
            labels: {}
          - aws_name: "CONTACTS_ABANDONED"
            prometheus_name: "connect_historical_contacts_abandoned_total"
            labels: {}
        # Additional metrics available - see production config for full list
        # Common additional metrics for testing:
        # - aws_name: "ABANDONMENT_RATE"
        #   prometheus_name: "connect_historical_abandonment_rate"
        #   labels: {}
        # - aws_name: "AVG_HANDLE_TIME"
        #   prometheus_name: "connect_historical_avg_handle_time_seconds"
        #   labels: {}
        # - aws_name: "SERVICE_LEVEL"
        #   prometheus_name: "connect_historical_service_level"
        #   labels: {}
        groupings:
          - "QUEUE"
          - "CHANNEL"
        filters:
          - key: "CHANNEL"
            values: ["VOICE", "CHAT", "TASK"]

# Global settings
global:
  # Default timeout for all operations
  timeout: 30s
  
  # Default labels to add to all metrics
  labels:
    environment: "test"
    service: "aws-connect"
    
  # Retry configuration
  retry:
    max_attempts: 3
    backoff_duration: 1s
    max_backoff_duration: 5s

# Test Configuration
# 
# Simplified configuration for testing core exporter functionality.
# Uses only generic collectors with essential metrics.
#
# Usage:
# 1. Start mock API: cd docs/tools/aws-mock-api-main && node server.js  
# 2. Run: ./connect-exporter --config.file=config.test.yml
#
# Enabled collectors:
# - agent_realtime_status: Individual agent status tracking
# - generic_realtime: Core real-time queue and agent metrics
# - generic_historical: Basic historical metrics (contacts handled/abandoned)
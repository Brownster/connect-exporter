# AWS Connect Exporter - Kensington Test Configuration with Mock API
# Optimized for operational monitoring with essential metrics only

listen_address: 127.0.0.1
listen_port: 9091

aws:
  region: "eu-west-2"
  # Mock API instance for testing
  instance_arn: "arn:aws:connect:eu-west-2:123456789012:instance/f604177c-b2ab-4c76-9033-635d195b2772"

collectors:
  # ✅ ESSENTIAL: Real-time queue performance metrics
  # Provides: caller counts, wait times, agent availability by queue/channel
  realtime_queue:
    enabled: true
    interval: 30  # 30 seconds for real-time visibility
    metrics_cache_ttl: 15s
    queue_cache_ttl: 5m
    queue_refresh_interval: 5m
    queues_include_regex: ""
    # Available real-time metrics via GetCurrentMetricData
    # Uncomment any extra metrics you wish to collect. Each entry
    # maps the AWS metric name to the Prometheus metric output.
    # - AGENTS_AFTER_CONTACT_WORK -> connect_queue_agents{state="AfterContactWork"}
    # - AGENTS_AVAILABLE         -> connect_queue_agents{state="Available"}
    # - AGENTS_ERROR             -> connect_queue_agents{state="Error"}
    # - AGENTS_NON_PRODUCTIVE    -> connect_queue_agents{state="NonProductive"}
    # - AGENTS_ON_CALL           -> connect_queue_agents{state="OnCall"}
    # - AGENTS_ON_CONTACT        -> connect_queue_agents{state="OnContact"}
    # - AGENTS_ONLINE            -> connect_queue_agents{state="Online"}
    # - AGENTS_STAFFED           -> connect_queue_agents{state="Staffed"}
    # - CONTACTS_IN_QUEUE        -> connect_queue_contacts_in_queue
    # - CONTACTS_SCHEDULED       -> connect_queue_contacts_scheduled
    # - OLDEST_CONTACT_AGE       -> connect_queue_oldest_contact_age_seconds
    # - SLOTS_ACTIVE             -> connect_queue_slots_active
    # - SLOTS_AVAILABLE          -> connect_queue_slots_available
    
  # ✅ ESSENTIAL: Current agent status distribution  
  # Shows how many agents are in each state (Available, On Contact, etc.)
  agent_realtime_status:
    enabled: true
    interval: 60  # 1 minute for agent state changes
    
  # ✅ VALUABLE: Daily call volumes and outcomes
  # Provides: calls handled today (inbound/outbound), abandoned calls
  historical_queue:
    enabled: true
    interval: 300  # 5 minutes for historical data

  historical_aht:
    enabled: true
    interval: 300

  historical_acw:
    enabled: true
    interval: 300
    
  # ❌ DISABLED: Agent status definitions (not operationally useful)
  # This only shows status definitions (always=1) and custom indicators (0/1)
  # Does NOT show actual agent counts in those statuses
  agent_status:
    enabled: false
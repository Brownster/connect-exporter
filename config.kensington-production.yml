# AWS Connect Exporter - Kensington Production Configuration
# Optimized for operational monitoring with essential metrics only

listen_address: 127.0.0.1
listen_port: 9090

aws:
  region: "eu-west-2"
  # Real Kensington AWS Connect instance
  instance_arn: "arn:aws:connect:eu-west-2:891612549865:instance/9ef29e46-0487-46f8-ae5f-9d495adb897f"

collectors:
  # Essential collectors
  agent_realtime_status:
    enabled: true
    interval: 60

  generic_realtime:
    enabled: true
    interval: 30
    collectors:
      - name: "queue_realtime_metrics"
        metrics:
          - aws_name: "AGENTS_AVAILABLE"
            prometheus_name: "connect_queue_agents"
            labels:
              state: "Available"
        groupings: ["QUEUE", "CHANNEL"]
        filters: []

  generic_historical:
    enabled: true
    interval: 300
    collectors:
      - name: "historical_queue"
        metrics:
          - aws_name: "CONTACTS_HANDLED"
            prometheus_name: "connect_historical_contacts_handled_total"
            labels: {}
        groupings: ["QUEUE", "CHANNEL"]
        filters: []
